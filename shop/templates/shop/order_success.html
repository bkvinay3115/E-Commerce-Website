{% extends 'shop/base.html' %}

{% block content %}

<div class="container mt-5 text-center">

    <h2 class="text-success">Order Confirmed ✅</h2>

    <p class="mt-3">Your order has been placed successfully.</p>

    <p><strong>Order ID:</strong> {{ order.order_id }}</p>

    <!-- Main action -->
    <div class="mt-3">
        <a href="{% url 'order_detail' order.order_id %}" class="btn btn-dark">
            View Order Details
        </a>
    </div>

    <!-- Secondary actions -->
    <div class="mt-3">
        <a href="{% url 'order_history' %}" class="btn btn-outline-secondary mr-2">
            My Orders
        </a>

        <a href="{% url 'home' %}" class="btn btn-primary">
            Continue Shopping
        </a>
    </div>

</div>

{% endblock %}
