{% extends 'shop/base.html' %}
{% load static %}

{% block content %}
<!-- Full page background -->
<div style="background-color: #7ba7d4ff; min-height: 100vh; padding: 40px;">

    <h1 class="text-center text-dark mb-4">Categories</h1>

    <div class="row">
        {% for category in categories %}
        <div class="col-md-4 mb-4">
            <!-- Assigning background color dynamically by category id -->
            <div class="card h-100 shadow-sm rounded text-white 
                        {% cycle 'bg-primary' 'bg-success' 'bg-warning text-dark' 'bg-danger' 'bg-info text-dark' %}">
                
                <!-- Image container for centering -->
                <div class="d-flex align-items-center justify-content-center bg-white" style="height:180px;">
                    {% if category.image %}
                        <img src="{{ category.image.url }}" 
                             style="max-height:150px; max-width:100%; object-fit:contain;" 
                             alt="{{ category.name }}">
                    {% else %}
                        <img src="{% static 'images/default-category.jpg' %}" 
                             style="max-height:150px; max-width:100%; object-fit:contain;" 
                             alt="{{ category.name }}">
                    {% endif %}
                </div>
                
                <div class="card-body">
                    <h5 class="card-title">{{ category.name }}</h5>
                    <p class="card-text text-truncate">{{ category.description }}</p>
                    
                    {% if category.id %}
                        <a href="{% url 'category_products' category.id %}" class="btn btn-light">View Products</a>
                    {% else %}
                        <button class="btn btn-dark" disabled>No Products</button>
                    {% endif %}
                </div>
            </div>
        </div>
        {% endfor %}
    </div>

</div>
{% endblock %}
